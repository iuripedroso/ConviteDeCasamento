<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite Luziane e Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush-50: #fdf3f0;
    --blush-100: #f7e4de;
    --blush-300: #e8b7a9;
    --blush-500: #cf8a75;
    --blush-700: #a85f4a;
    --blush-900: #5c3325;
    --gold: #b8935f;
    --cream: #fffaf5;
    --cream-glass: rgba(255, 250, 245, 0.86);
    --text-dark: #4a3c33;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-dark);
    background: #f4e6d8;
    min-height: 100%;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    max-width: none;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,250,245,0.15) 0%, rgba(255,250,245,0.05) 45%, rgba(255,250,245,0.35) 100%);
  }

  .hearts {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    top: 100%;
    border-radius: 50%;
    transform: rotate(-45deg);
    animation-name: rise;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
  }

  .heart::before { top: -50%; left: 0; }
  .heart::after { top: 0; left: 50%; }

  @keyframes rise {
    from { top: 100%; opacity: 0.85; }
    to   { top: -12%; opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top, 0px)) 24px max(32px, env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
  }

  /* ---------- ETAPA 1: PRELÚDIO (máquina de escrever) ---------- */

  #prelude-stage.hidden { display: none; }

  #prelude-stage {
    background: var(--cream-glass);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(232, 183, 169, 0.6);
    border-radius: 14px;
    padding: 44px 30px 36px;
    box-shadow: 0 20px 50px rgba(92, 51, 37, 0.2);
  }

  .eyebrow {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    color: var(--blush-900);
  }

  .eyebrow-rule {
    width: 130px;
    height: 12px;
    margin: -4px auto 22px;
  }

  .eyebrow-rule svg { width: 100%; height: 100%; display: block; }
  .eyebrow-rule path { stroke: var(--gold); stroke-width: 1; fill: none; }
  .eyebrow-rule circle { fill: var(--gold); }

  #typewriter {
    font-size: 19px;
    font-style: italic;
    line-height: 1.85;
    color: var(--text-dark);
    min-height: 190px;
    margin: 0;
  }

  .caret {
    display: inline-block;
    width: 1px;
    margin-left: 2px;
    background: var(--blush-700);
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .reveal-btn,
  .soft-btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--blush-900);
    padding: 12px 30px;
    border: 1px solid rgba(184, 147, 95, 0.55);
    border-radius: 999px;
    background: rgba(255, 250, 245, 0.55);
    cursor: pointer;
  }

  .reveal-btn {
    margin-top: 26px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  .reveal-btn.show {
    opacity: 1;
    transform: translateY(0);
    animation: pulse 2.2s ease-in-out infinite;
    pointer-events: auto;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  /* ---------- ETAPA 2: CARTA COM DUAS FOLHAS ---------- */

  #letter {
    display: none;
    position: relative;
    animation: card-reveal 0.7s ease;
  }

  #letter.open { display: grid; }

  @keyframes card-reveal {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .sheet {
    grid-area: 1 / 1;
    border: 1px solid rgba(232, 183, 169, 0.6);
    border-radius: 14px;
    padding: 48px 32px 36px;
    box-shadow: 0 20px 50px rgba(92, 51, 37, 0.2);
  }

  /* folha de trás: aparece "espiando" por baixo, levemente torta */
  .sheet-back {
    background: rgba(253, 243, 240, 0.94);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transform: rotate(3deg) translate(8px, 10px);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }

  #letter.revealed .sheet-back { transform: none; }

  /* folha da frente: arrastável */
  .sheet-front {
    position: relative;
    z-index: 2;
    background: rgba(255, 250, 245, 0.98);
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.45s ease;
    will-change: transform;
  }

  .sheet-front.dragging {
    transition: none;
    cursor: grabbing;
  }

  .sheet-front:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }

  .invite-eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--blush-500);
    margin-bottom: 12px;
  }

  .names {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: var(--blush-900);
    line-height: 1.3;
  }

  .and {
    font-size: 16px;
    color: var(--gold);
    margin: 4px 0;
    letter-spacing: 2px;
  }

  .invite-msg {
    font-size: 18px;
    color: var(--text-dark);
    margin: 24px 0;
    line-height: 1.6;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 24px auto;
  }

  .footer-note {
    font-family: 'Great Vibes', cursive;
    font-size: 24px;
    color: var(--blush-700);
    margin-top: 8px;
  }

  .swipe-hint {
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--blush-500);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .swipe-hint .arrow {
    display: inline-block;
    color: var(--gold);
    animation: nudge 1.6s ease-in-out infinite;
  }

  .swipe-hint .arrow.left { animation-name: nudge-left; }

  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(5px); }
  }

  @keyframes nudge-left {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-5px); }
  }

  /* conteúdo da folha de trás */
  .back-title {
    font-family: 'Great Vibes', cursive;
    font-size: 42px;
    color: var(--blush-900);
    line-height: 1.2;
  }

  .date-line {
    font-size: 20px;
    font-weight: 600;
    color: var(--blush-900);
    margin-top: 6px;
  }

  .schedule {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    max-width: 280px;
  }

  .schedule li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    font-size: 18px;
    border-bottom: 1px dashed rgba(184, 147, 95, 0.4);
  }

  .schedule li:last-child { border-bottom: none; }

  .schedule .label {
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 14px;
    color: var(--blush-700);
  }

  .schedule .time {
    font-weight: 600;
    color: var(--text-dark);
  }

  .place-name {
    font-size: 21px;
    font-weight: 600;
    color: var(--blush-900);
  }

  .place-address {
    font-size: 17px;
    line-height: 1.5;
    margin: 4px 0 18px;
  }

  .map-btn {
    display: inline-block;
    text-decoration: none;
  }

  .back-again {
    display: block;
    margin: 20px auto 0;
    font-size: 13px;
    padding: 9px 22px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #letter.revealed .back-again {
    opacity: 1;
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    #letter { animation: none; }
    .caret { animation: none; }
    .reveal-btn.show { animation: none; }
    .swipe-hint .arrow { animation: none; }
    .sheet-front, .sheet-back { transition: none; }
  }
</style>
</head>
<body>

<div class="bg"><img src="https://github.com/iuripedroso/ConviteDeCasamento/blob/main/img2.jpg?raw=true" alt=""></div>
<div class="hearts" id="hearts"></div>

<div class="stage">
  <div class="card">

    <div id="prelude-stage">
      <div class="eyebrow">Convite especial</div>
      <div class="eyebrow-rule">
        <svg viewBox="0 0 130 12" preserveAspectRatio="none">
          <path d="M0 6 H54" />
          <circle cx="65" cy="6" r="3" />
          <path d="M76 6 H130" />
        </svg>
      </div>

      <p id="typewriter"></p>

      <button class="reveal-btn" id="reveal-btn" onclick="openInvite()">Abrir o convite</button>
    </div>

    <div id="letter">

      <!-- FOLHA DE TRÁS: localização e horários -->
      <div class="sheet sheet-back" id="sheet-back">
        <div class="back-title">Quando &amp; onde</div>
        <div class="date-line" id="info-data"></div>

        <div class="divider"></div>

        <ul class="schedule" id="info-horarios"></ul>

        <div class="divider"></div>

        <div class="place-name" id="info-local"></div>
        <div class="place-address" id="info-endereco"></div>
        <a class="soft-btn map-btn" id="info-mapa" target="_blank" rel="noopener">&#128205; Ver no mapa</a>

        <button class="soft-btn back-again" id="back-again" type="button">&#8634; Ver a mensagem</button>
      </div>

      <!-- FOLHA DA FRENTE: arrastável -->
      <div class="sheet sheet-front" id="sheet-front" tabindex="0"
           aria-label="Convite. Arraste para o lado ou use as setas para ver local e horários.">
        <div class="invite-eyebrow">Convite especial</div>
        <div class="names">Luziane</div>
        <div class="and">&amp;</div>
        <div class="names">Anderson</div>

        <p class="invite-msg">convidam com muito carinho para<br>celebrar o seu casamento</p>

        <div class="divider"></div>

        <div class="footer-note">Sua presença é o maior presente</div>

        <div class="swipe-hint">
          <span class="arrow left">&larr;</span>
          arraste para ver o local
          <span class="arrow">&rarr;</span>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  // =========================================================
  //  EDITE AQUI: data, horários e local do casamento
  // =========================================================
  var INFO = {
    data: "Data a confirmar",               // ex.: "Sábado, 14 de março de 2027"
    horarios: [
      { label: "Cerimônia", hora: "a confirmar" },   // ex.: "16h00"
      { label: "Recepção",  hora: "a confirmar" }    // ex.: "18h30"
    ],
    local: "Local a confirmar",             // ex.: "Espaço Jardim das Flores"
    endereco: "Endereço a confirmar",       // ex.: "Rua X, 123 – Bairro, Cidade/UF"
    // link do mapa: deixe "" para gerar automaticamente pelo endereço,
    // ou cole o link de compartilhamento do Google Maps
    mapa: ""
  };

  (function fillInfo() {
    document.getElementById('info-data').textContent = INFO.data;
    document.getElementById('info-local').textContent = INFO.local;
    document.getElementById('info-endereco').textContent = INFO.endereco;

    var list = document.getElementById('info-horarios');
    INFO.horarios.forEach(function (h) {
      var li = document.createElement('li');
      var a = document.createElement('span'); a.className = 'label'; a.textContent = h.label;
      var b = document.createElement('span'); b.className = 'time'; b.textContent = h.hora;
      li.appendChild(a); li.appendChild(b);
      list.appendChild(li);
    });

    var mapUrl = INFO.mapa ||
      'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(INFO.local + ' ' + INFO.endereco);
    document.getElementById('info-mapa').href = mapUrl;
  })();

  // corações flutuando
  (function () {
    var layer = document.getElementById('hearts');
    var colors = [
      'rgba(207, 138, 117, 0.55)',
      'rgba(184, 147, 95, 0.5)',
      'rgba(168, 95, 74, 0.4)',
      'rgba(232, 183, 169, 0.6)'
    ];
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    function spawnHeart() {
      var el = document.createElement('div');
      var size = 8 + Math.random() * 20;
      var left = Math.random() * 100;
      var duration = 7 + Math.random() * 7;
      el.className = 'heart';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = left + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = duration + 's';
      el.addEventListener('animationend', function () { el.remove(); });
      layer.appendChild(el);
    }

    for (var i = 0; i < 4; i++) setTimeout(spawnHeart, i * 400);
    setInterval(spawnHeart, 900);
  })();

  // máquina de escrever
  (function () {
    var lines = [
      "Existem histórias que a gente escreve sozinho,",
      "e outras que só fazem sentido a dois.",
      "",
      "A nossa começou num encontro qualquer",
      "e foi virando rotina, cumplicidade e lar.",
      "",
      "Agora queremos contar o próximo capítulo",
      "ao lado das pessoas que amamos.",
      "",
      "Convidamos vocês, à celebrar esse sim!"
    ];
    var text = lines.join('\n');
    var target = document.getElementById('typewriter');
    var btn = document.getElementById('reveal-btn');
    var caret = document.createElement('span');
    caret.className = 'caret';
    caret.innerHTML = '&nbsp;';
    target.appendChild(caret);

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function finish() {
      target.innerHTML = text.replace(/\n/g, '<br>');
      btn.classList.add('show');
    }

    if (reduced) {
      finish();
      return;
    }

    var i = 0;
    var speed = 32;
    function type() {
      if (i < text.length) {
        var ch = text.charAt(i);
        var node = document.createTextNode(ch === '\n' ? '' : ch);
        if (ch === '\n') target.insertBefore(document.createElement('br'), caret);
        target.insertBefore(node, caret);
        i++;
        setTimeout(type, speed);
      } else {
        btn.classList.add('show');
      }
    }
    type();
  })();

  function openInvite() {
    document.getElementById('prelude-stage').classList.add('hidden');
    document.getElementById('letter').classList.add('open');
  }

  // arrastar a folha da frente para o lado
  (function () {
    var letter = document.getElementById('letter');
    var front = document.getElementById('sheet-front');
    var backAgain = document.getElementById('back-again');

    var startX = 0, startY = 0, dx = 0;
    var dragging = false, gone = false;

    function flyAway(dir) {
      var w = front.offsetWidth;
      front.style.transform = 'translateX(' + (dir * (w + 120)) + 'px) rotate(' + (dir * 16) + 'deg)';
      front.style.opacity = '0';
      front.style.pointerEvents = 'none';
      front.setAttribute('aria-hidden', 'true');
      gone = true;
      letter.classList.add('revealed');
      setTimeout(function () { backAgain.focus({ preventScroll: true }); }, 450);
    }

    function bringBack() {
      front.style.transform = '';
      front.style.opacity = '';
      front.style.pointerEvents = '';
      front.removeAttribute('aria-hidden');
      gone = false;
      letter.classList.remove('revealed');
    }

    front.addEventListener('pointerdown', function (e) {
      if (gone) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      front.setPointerCapture(e.pointerId);
      front.classList.add('dragging');
    });

    front.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx = e.clientX - startX;
      var dy = (e.clientY - startY) * 0.15;
      front.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx / 18) + 'deg)';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      front.classList.remove('dragging');
      if (Math.abs(dx) > front.offsetWidth * 0.28) {
        flyAway(dx > 0 ? 1 : -1);
      } else {
        front.style.transform = '';
      }
    }

    front.addEventListener('pointerup', endDrag);
    front.addEventListener('pointercancel', endDrag);

    // teclado: setas ou Enter também viram a folha
    front.addEventListener('keydown', function (e) {
      if (gone) return;
      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flyAway(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); flyAway(-1); }
    });

    backAgain.addEventListener('click', bringBack);
  })();
</script>
</body>
</html>
