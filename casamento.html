<title>Convite Luziane e Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush-50: #fdf3f0;
    --blush-100: #f7e4de;
    --blush-300: #e8b7a9;
    --blush-500: #cf8a75;
    --blush-700: #a85f4a;
    --blush-900: #5c3325;
    --gold: #b8935f;
    --cream: #fffaf5;
    --cream-glass: rgba(255, 250, 245, 0.86);
    --text-dark: #4a3c33;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-dark);
    background: #f4e6d8;
    min-height: 100%;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    max-width: none;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,250,245,0.15) 0%, rgba(255,250,245,0.05) 45%, rgba(255,250,245,0.35) 100%);
  }

  .hearts {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    top: 100%;
    border-radius: 50%;
    transform: rotate(-45deg);
    animation-name: rise;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
  }

  .heart::before { top: -50%; left: 0; }
  .heart::after { top: 0; left: 50%; }

  @keyframes rise {
    from { top: 100%; opacity: 0.85; }
    to   { top: -12%; opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top, 0px)) 24px max(32px, env(safe-area-inset-bottom, 0px));
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
  }

  /* ---------- STAGE 1: PRELÚDIO (typewriter) ---------- */

  #prelude-stage.hidden { display: none; }

  #prelude-stage {
    background: var(--cream-glass);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(232, 183, 169, 0.6);
    border-radius: 14px;
    padding: 44px 30px 36px;
    box-shadow: 0 20px 50px rgba(92, 51, 37, 0.2);
  }

  .eyebrow {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    color: var(--blush-900);
  }

  .eyebrow-rule {
    width: 130px;
    height: 12px;
    margin: -4px auto 22px;
  }

  .eyebrow-rule svg { width: 100%; height: 100%; display: block; }
  .eyebrow-rule path { stroke: var(--gold); stroke-width: 1; fill: none; }
  .eyebrow-rule circle { fill: var(--gold); }

  #typewriter {
    font-size: 19px;
    font-style: italic;
    line-height: 1.85;
    color: var(--text-dark);
    min-height: 190px;
    margin: 0;
  }

  .caret {
    display: inline-block;
    width: 1px;
    margin-left: 2px;
    background: var(--blush-700);
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .reveal-btn {
    margin-top: 26px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--blush-900);
    padding: 12px 30px;
    border: 1px solid rgba(184, 147, 95, 0.55);
    border-radius: 999px;
    background: rgba(255, 250, 245, 0.55);
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  .reveal-btn.show {
    opacity: 1;
    transform: translateY(0);
    animation: pulse 2.2s ease-in-out infinite;
    pointer-events: auto;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  /* ---------- STAGE 2: INVITE ---------- */

  #invite-card {
    display: none;
    background: var(--cream-glass);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(232, 183, 169, 0.6);
    border-radius: 14px;
    padding: 48px 32px;
    box-shadow: 0 20px 50px rgba(92, 51, 37, 0.2);
    animation: card-reveal 0.7s ease;
  }

  @keyframes card-reveal {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .invite-eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--blush-500);
    margin-bottom: 12px;
  }

  .names {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: var(--blush-900);
    line-height: 1.3;
  }

  .and {
    font-size: 16px;
    color: var(--gold);
    margin: 4px 0;
    letter-spacing: 2px;
  }

  .invite-msg {
    font-size: 18px;
    color: var(--text-dark);
    margin: 24px 0;
    line-height: 1.6;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 24px auto;
  }

  .details {
    font-size: 18px;
    line-height: 2;
    color: var(--text-dark);
    margin-bottom: 24px;
  }

  .details .icon {
    color: var(--blush-700);
    margin-right: 6px;
  }

  .footer-note {
    font-family: 'Great Vibes', cursive;
    font-size: 24px;
    color: var(--blush-700);
    margin-top: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    #invite-card { animation: none; }
    .caret { animation: none; }
    .reveal-btn.show { animation: none; }
  }
</style>

<div class="bg"><img src="https://github.com/iuripedroso/ConviteDeCasamento/blob/main/img2.jpg?raw=true"></div>

<div class="hearts" id="hearts"></div>

<div class="stage">
  <div class="card">

    <div id="prelude-stage">
      <div class="eyebrow">Convite especial</div>
      <div class="eyebrow-rule">
        <svg viewBox="0 0 130 12" preserveAspectRatio="none">
          <path d="M0 6 H54" />
          <circle cx="65" cy="6" r="3" />
          <path d="M76 6 H130" />
        </svg>
      </div>

      <p id="typewriter"></p>

      <button class="reveal-btn" id="reveal-btn" onclick="openInvite()">Abrir o convite</button>
    </div>

    <div id="invite-card">
      <div class="invite-eyebrow">Convite especial</div>
      <div class="names">Luziane</div>
      <div class="and">&amp;</div>
      <div class="names">Anderson</div>

      <p class="invite-msg">convidam com muito carinho para<br>celebrar o seu casamento</p>

      <div class="divider"></div>

      <div class="details">
        <div><span class="icon">&#128197;</span>Data a confirmar</div>
        <div><span class="icon">&#128205;</span>Local a confirmar</div>
      </div>

      <div class="footer-note">Sua presença é o maior presente</div>
    </div>

  </div>
</div>

<script>
  // floating hearts, toned to the invite palette
  (function () {
    var layer = document.getElementById('hearts');
    var colors = [
      'rgba(207, 138, 117, 0.55)',
      'rgba(184, 147, 95, 0.5)',
      'rgba(168, 95, 74, 0.4)',
      'rgba(232, 183, 169, 0.6)'
    ];
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    function spawnHeart() {
      var el = document.createElement('div');
      var size = 8 + Math.random() * 20;
      var left = Math.random() * 100;
      var duration = 7 + Math.random() * 7;
      el.className = 'heart';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = left + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = duration + 's';
      el.addEventListener('animationend', function () { el.remove(); });
      layer.appendChild(el);
    }

    for (var i = 0; i < 4; i++) setTimeout(spawnHeart, i * 400);
    setInterval(spawnHeart, 900);
  })();

  // typewriter intro
  (function () {
    var lines = [
      "Existem histórias que a gente escreve sozinho,",
      "e outras que só fazem sentido a dois.",
      "",
      "A nossa começou num encontro qualquer",
      "e foi virando rotina, cumplicidade e lar.",
      "",
      "Agora queremos contar o próximo capítulo",
      "ao lado das pessoas que amamos.",
      "",
      "Vem com a gente celebrar esse “sim”?"
    ];
    var text = lines.join('\n');
    var target = document.getElementById('typewriter');
    var btn = document.getElementById('reveal-btn');
    var caret = document.createElement('span');
    caret.className = 'caret';
    caret.innerHTML = '&nbsp;';
    target.appendChild(caret);

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function finish() {
      target.innerHTML = text.replace(/\n/g, '<br>');
      btn.classList.add('show');
    }

    if (reduced) {
      finish();
      return;
    }

    var i = 0;
    var speed = 32;
    function type() {
      if (i < text.length) {
        var ch = text.charAt(i);
        var node = document.createTextNode(ch === '\n' ? '' : ch);
        if (ch === '\n') target.insertBefore(document.createElement('br'), caret);
        target.insertBefore(node, caret);
        i++;
        setTimeout(type, speed);
      } else {
        btn.classList.add('show');
      }
    }
    type();
  })();

  function openInvite() {
    document.getElementById('prelude-stage').classList.add('hidden');
    document.getElementById('invite-card').style.display = 'block';
  }
</script>
